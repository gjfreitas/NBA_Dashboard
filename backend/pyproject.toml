[project]
name = "nbadash"
version = "0.1.0"
description = "NBA live data relay: curl_cffi client, normalizers, fixture replay, FastAPI API"
requires-python = ">=3.10"
dependencies = [
  "curl_cffi>=0.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "tzdata>=2024.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
ingest = ["nba_api>=1.5"]
cloud = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools]
packages = ["nbadash"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_availability: run refresh_availability for real (with fake NBA files) instead of stubbing it out"]
